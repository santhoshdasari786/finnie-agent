[project]
name = "ai-finance-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain[mcp]>=0.3",
    "langchain-core>=0.3",
    "fastmcp>=4.1",
    "langgraph>=0.2",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "chromadb>=0.5",
    "yfinance>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ipython>=8.28",
]

[tool.uv]
package = false
