# Retrieval eval set. Three groups, one purpose: choose retrieval.min_score from evidence.
#   in_kb      clearly covered by an article        -> must NOT be refused; `expect` = article_id that should rank first
#   borderline finance-related, probably not covered -> informational: shows where the grey zone sits
#   off_topic  not answerable from the KB at all     -> must be refused (no_source)
#   routed_to_market  live prices: the router answers these before retrieval is consulted
# Edit freely: wrong `expect` values are findings, not mistakes. Add a question, re-run, read the table.

