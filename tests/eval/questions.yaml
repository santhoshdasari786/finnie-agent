# Price and "close" questions never reach retrieval: the router sends them to the Market agent by rule.
# tests/kb/knowledge_base_test.py proves that offline. (Retrieval alone WOULD answer them with the index explainer,
# at 0.687, above the 0.66 threshold: that is why they are a routing matter, not a retrieval one.)
routed_to_market:
  - { q: "What was the Nifty 50 close yesterday?" }
  - { q: "What is the share price of Reliance right now?" }
  - { q: "What was the Sensex at the close of trading today?" }
  - { q: "What is the live price of the Nifty Bank index?" }
