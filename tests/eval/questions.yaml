  - { q: "What is the weather in Mumbai today?" }
  - { q: "Who won the cricket match yesterday?" }
  - { q: "Give me a recipe for paneer butter masala" }
  - { q: "What was the Nifty 50 close yesterday?" }
  - { q: "What is the share price of Reliance right now?" }
  - { q: "What is the price of Bitcoin today?" }
  - { q: "What is the capital of France?" }
  - { q: "Write a Python function to reverse a string" }
  - { q: "Translate good morning into Hindi" }
  - { q: "How do I fix a flat bicycle tyre?" }
